# Render Blueprint: one free PostgreSQL database and one free web service that serves the
# website, the API and the moderator admin from the same address.
# Render dashboard -> New -> Blueprint -> pick this repository.

databases:
  - name: scam-hunter-db
    plan: free
    region: frankfurt
    databaseName: scam_hunter
    user: scam_hunter

services:
  - type: web
    name: scam-hunter
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/reports/stats/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scam-hunter-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # First moderator account for /admin/. Render asks for these when the Blueprint is created.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Optional online checks. Leave empty to skip them.
      - key: SCAM_HUNTER_AI_API_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: URLHAUS_AUTH_KEY
        sync: false
      # Android app download link for the website's button and QR code.
      - key: SCAM_HUNTER_ANDROID_APK_URL
        sync: false
      - key: SCAM_HUNTER_ANDROID_VERSION
        sync: false
